<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>แปลเมนู</title>
<meta name="description" content="ถ่ายรูปเมนูหรือป้ายภาษาต่างประเทศ แปลเป็นไทย บอกว่ามีหมู เผ็ด หรือของที่แพ้ไหม สั่งอาหารได้ และส่งรายจ่ายเข้า TripBudget">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* White ground, warm orange accent (food), cards like TripBudget so both apps feel like a pair */
:root{
  --bg:#ffffff; --soft:#f5f5f4; --soft2:#e9e7e4; --line:#e7e4e0; --line2:#d3cfca;
  --ink:#1c1917; --ink2:#57534e; --ink3:#8a837c;
  --acc:#c2410c; --acc-soft:#fff1e8; --acc-ink:#9a3412;
  --good:#16834a; --good-soft:#e5f5ec; --warn:#b86200; --warn-soft:#fff3e0; --bad:#cf3434; --bad-soft:#fdecec;
  --f-body:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI','Noto Sans JP','Noto Sans KR','Noto Sans SC',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);width:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;min-height:44px}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
h1{font-size:22px;line-height:1.25}h2{font-size:15px;font-weight:700}
.muted{color:var(--ink3);font-size:13px}.small{font-size:12.5px}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px 16px;display:flex;align-items:center;gap:8px}
.logo{font-weight:700;font-size:17px;white-space:nowrap}.logo b{color:var(--acc)}
#ctx{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.ib:active{background:var(--soft)}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:var(--soft);border-color:transparent}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ch h2{flex:1}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.right{text-align:right}.mt{margin-top:12px}.mt-s{margin-top:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;white-space:nowrap;min-height:44px;text-decoration:none}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:active{background:var(--acc-ink)}
.btn.ghost{border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}.btn:disabled{opacity:.45}
.link{color:var(--acc-ink);font-weight:600;text-decoration:underline;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;border:1px solid var(--line2);border-radius:99px;padding:7px 13px;font-size:13.5px;background:#fff;color:var(--ink2);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.seg{display:flex;background:var(--soft2);border-radius:10px;padding:3px}.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);min-height:40px}.seg button.on{background:#fff;color:var(--acc-ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px}.alert.good{background:var(--good-soft);color:var(--good)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.info{background:var(--soft);color:var(--ink2)}
.empty{text-align:center;padding:30px 16px;color:var(--ink3)}
.shoot{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;min-height:132px;font-weight:700;font-size:16px;cursor:pointer;text-align:center;padding:10px}
.shoot label span{font-size:40px;line-height:1}
.shoot .cam{background:var(--acc);color:#fff}.shoot .gal{background:var(--acc-soft);color:var(--acc-ink)}
.hist{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;width:100%;text-align:left;background:#fff}
.hist .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex-shrink:0}
/* result items */
.it{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.it.warn{border-color:#f0c48a;background:#fffbf5}.it.bad{border-color:#f1b0b0;background:#fffafa}
.it .th{font-size:16.5px;font-weight:700;line-height:1.35;display:block;word-break:break-word}
.it .orig{font-size:15px;color:var(--ink2);word-break:break-word}
.it .rd{font-size:12.5px;color:var(--ink3)}
.it .desc{font-size:13.5px;color:var(--ink2);margin-top:4px}
.it .pr{text-align:right;flex-shrink:0;max-width:40%}.it .pr b{display:block;font-size:16px}
.fl{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.fl span{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.fl .bad{background:var(--bad-soft);color:var(--bad)}.fl .warn{background:var(--warn-soft);color:var(--warn)}.fl .good{background:var(--good-soft);color:var(--good)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.qty button{width:38px;height:36px;font-size:18px;font-weight:700;color:var(--acc-ink)}.qty b{min-width:26px;text-align:center;font-family:var(--f-num)}
.photo{width:100%;max-height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block}
.basket{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:600px;margin:0 auto}
.basket .btn{background:var(--acc);color:#fff;min-height:42px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--acc-soft);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* sheet / dialog / big */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(20,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px 0}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 10px}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sh b{font-size:17px}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:15px}
.sf{position:sticky;bottom:0;background:#fff;display:flex;gap:8px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--line)}
.sf .sp{flex:1}
.oline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
#big{position:fixed;inset:0;z-index:400;background:#fff;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(70px + env(safe-area-inset-bottom,0px));cursor:pointer}
#big .ph{font-size:clamp(26px,8vw,44px);font-weight:700;line-height:1.3;text-align:center;margin:10px 0 4px}
#big .phs{font-size:15px;color:var(--ink3);text-align:center;margin-bottom:16px}
#big .ol{font-size:clamp(24px,7vw,40px);font-weight:700;line-height:1.3;padding:12px 0;border-bottom:2px solid var(--line);display:flex;gap:12px;align-items:baseline}
#big .ol .q{color:var(--acc);font-family:var(--f-num);margin-left:auto;white-space:nowrap}
#big .ol small{display:block;font-size:14px;color:var(--ink3);font-weight:500}
#big .ex{font-size:clamp(20px,6vw,30px);font-weight:700;color:var(--bad);text-align:center;margin-top:16px}
#big .hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:var(--ink3)}
#lb{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:grid;place-items:center}#lb img{max-width:96vw;max-height:92vh}
#dlg{z-index:150;align-items:center;padding:16px}
.dlg{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px}
.dlg h3{font-size:17px;margin-bottom:6px}.dlg .dt{font-size:14.5px;color:var(--ink2);margin-bottom:12px;white-space:pre-wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:500;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;text-align:center}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}
#updBar{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:90;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;cursor:pointer;max-width:560px;margin:0 auto}
#updBar b{color:#fdba74}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="logo" data-act="home">แปล<b>เมนู</b></button>
  <div id="ctx"></div>
  <button class="ib" data-act="settings" aria-label="ตั้งค่า">⚙️</button>
</header>
<main id="view"></main>
<div id="basket"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>
<div class="scrim" id="sheet" hidden></div>
<div class="scrim" id="dlg" hidden></div>
<div id="big" data-act="closeBig" hidden></div>
<div id="lb" data-act="closeLb" hidden><img id="lbImg" alt="รูปเมนู"></div>
<div id="updBar" data-act="applyUpdate" hidden>มีเวอร์ชันใหม่ <b>แตะเพื่อโหลดใหม่</b></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="version.js"></script>
<script>
'use strict';
/* ============ DATA ============ */
const KEY = 'menu_v1', HKEY = 'menu_hist', RKEY = 'menu_rates';
const TB_ACTIVE = 'tb_active', TB_INBOX = 'tb_inbox', TB_URL = '../tripbudget/';
// ประเทศ: ธง ชื่อ สกุลเงิน ภาษา (ใช้กับเสียงอ่านและประโยคสั่งอาหาร)
const COUNTRIES = {
  JP:['🇯🇵','ญี่ปุ่น','JPY','ja'], KR:['🇰🇷','เกาหลีใต้','KRW','ko'], CN:['🇨🇳','จีน','CNY','zh-Hans'], TW:['🇹🇼','ไต้หวัน','TWD','zh-Hant'],
  HK:['🇭🇰','ฮ่องกง','HKD','zh-Hant'], VN:['🇻🇳','เวียดนาม','VND','vi'], SG:['🇸🇬','สิงคโปร์','SGD','en'], MY:['🇲🇾','มาเลเซีย','MYR','en'],
  ID:['🇮🇩','อินโดนีเซีย','IDR','en'], PH:['🇵🇭','ฟิลิปปินส์','PHP','en'], LA:['🇱🇦','ลาว','LAK','en'], KH:['🇰🇭','กัมพูชา','KHR','en'],
  MM:['🇲🇲','เมียนมา','MMK','en'], IN:['🇮🇳','อินเดีย','INR','en'], AE:['🇦🇪','ยูเออี','AED','en'], GB:['🇬🇧','สหราชอาณาจักร','GBP','en'],
  EU:['🇪🇺','ยุโรป','EUR','en'], CH:['🇨🇭','สวิตเซอร์แลนด์','CHF','en'], US:['🇺🇸','สหรัฐอเมริกา','USD','en'], CA:['🇨🇦','แคนาดา','CAD','en'],
  AU:['🇦🇺','ออสเตรเลีย','AUD','en'], NZ:['🇳🇿','นิวซีแลนด์','NZD','en'], TH:['🇹🇭','ไทย','THB','en'], OTHER:['🌍','ประเทศอื่นๆ','USD','en']
};
const SYM = {THB:'฿',JPY:'¥',KRW:'₩',CNY:'¥',HKD:'HK$',TWD:'NT$',SGD:'S$',MYR:'RM',VND:'₫',IDR:'Rp',PHP:'₱',INR:'₹',LAK:'₭',KHR:'៛',MMK:'K',USD:'$',EUR:'€',GBP:'£',CHF:'CHF ',AUD:'A$',NZD:'NZ$',CAD:'C$',AED:'AED '};
const ZERO_DEC = new Set(['JPY','KRW','VND','IDR','LAK','KHR','MMK']);
const FALLBACK = {USD:32.9,EUR:37.5,JPY:0.22,KRW:0.024,CNY:4.55,HKD:4.2,TWD:1.05,SGD:25.5,MYR:7.6,VND:0.00125,IDR:0.002,PHP:0.57,INR:0.38,LAK:0.0015,KHR:0.0082,MMK:0.0157,GBP:44,CHF:40,AUD:21.5,NZD:19.5,CAD:24,AED:8.96};
const TTS_LANG = {ja:'ja-JP', ko:'ko-KR', 'zh-Hans':'zh-CN', 'zh-Hant':'zh-TW', vi:'vi-VN', en:'en-US'};
// ประโยคสำหรับยื่นให้พนักงาน
const P = {
  ja:{order:'これをください', noPork:'豚肉は食べられません', noBeef:'牛肉は食べられません', veg:'ベジタリアンです（肉・魚は食べられません）', seafood:'魚介類のアレルギーがあります', nuts:'ナッツ・ピーナッツのアレルギーがあります', spicy:'辛くしないでください', check:'お会計お願いします'},
  ko:{order:'이거 주세요', noPork:'돼지고기를 못 먹어요', noBeef:'소고기를 못 먹어요', veg:'저는 채식주의자예요', seafood:'해산물 알레르기가 있어요', nuts:'견과류 알레르기가 있어요', spicy:'안 맵게 해 주세요', check:'계산해 주세요'},
  'zh-Hans':{order:'我要这个', noPork:'我不吃猪肉', noBeef:'我不吃牛肉', veg:'我吃素', seafood:'我对海鲜过敏', nuts:'我对坚果过敏', spicy:'请不要辣', check:'买单'},
  'zh-Hant':{order:'我要這個', noPork:'我不吃豬肉', noBeef:'我不吃牛肉', veg:'我吃素', seafood:'我對海鮮過敏', nuts:'我對堅果過敏', spicy:'請不要辣', check:'買單'},
  vi:{order:'Cho tôi món này', noPork:'Tôi không ăn thịt heo', noBeef:'Tôi không ăn thịt bò', veg:'Tôi ăn chay', seafood:'Tôi bị dị ứng hải sản', nuts:'Tôi bị dị ứng các loại hạt', spicy:'Đừng cay nhé', check:'Tính tiền'},
  en:{order:"I'd like this, please", noPork:"I can't eat pork", noBeef:"I can't eat beef", veg:"I'm vegetarian", seafood:"I'm allergic to seafood", nuts:"I'm allergic to nuts", spicy:'Not spicy, please', check:'Check, please'}
};
const P_TH = {order:'ขออันนี้', noPork:'ไม่กินหมู', noBeef:'ไม่กินเนื้อวัว', veg:'กินมังสวิรัติ', seafood:'แพ้อาหารทะเล', nuts:'แพ้ถั่ว', spicy:'ไม่เอาเผ็ด', check:'เช็กบิล'};
const DIETS = [['pork','🐷 ไม่กินหมู','noPork','หมูและของที่ทำจากหมู (น้ำมันหมู น้ำซุปกระดูกหมู)'], ['beef','🐄 ไม่กินเนื้อวัว','noBeef','เนื้อวัว'], ['veg','🥬 มังสวิรัติ','veg','เนื้อสัตว์ ปลา อาหารทะเล และน้ำซุปจากสัตว์'],
  ['seafood','🦐 แพ้อาหารทะเล','seafood','กุ้ง ปู หอย ปลา'], ['nuts','🥜 แพ้ถั่ว','nuts','ถั่วลิสงและถั่วเปลือกแข็ง'], ['spicy','🌶️ ไม่กินเผ็ด','spicy','อาหารเผ็ด']];

/* ============ HELPERS ============ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function money(n, c='THB'){ n = num(n); const d = ZERO_DEC.has(c) || (c === 'THB' && Math.abs(n) >= 100) ? 0 : 2;
  return (n < 0 ? '-' : '') + (SYM[c] || c + ' ') + Math.abs(n).toLocaleString('th-TH', {maximumFractionDigits:d}); }
function toast(msg, type=''){ const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; $('#toast').appendChild(el); setTimeout(() => el.remove(), 3000); }
const ago = t => { const m = Math.round((Date.now() - t) / 6e4); if (m < 1) return 'เมื่อสักครู่'; if (m < 60) return m + ' นาทีที่แล้ว'; const h = Math.round(m / 60); if (h < 24) return h + ' ชม.ที่แล้ว'; return Math.round(h / 24) + ' วันที่แล้ว'; };
function lsGet(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast('บันทึกไม่สำเร็จ พื้นที่ในเครื่องเต็ม', 'bad'); return false; } }

/* ============ STATE ============ */
let st = Object.assign({cfg:{url:'', token:''}, diet:{}, mode:'menu', country:'', curr:'', lastPay:''}, lsGet(KEY, {}));
st.diet = st.diet || {};
if (!st.cfg.url && self.AI_URL) st.cfg.url = self.AI_URL;
const save = () => lsSet(KEY, st);
let hist = lsGet(HKEY, []); if (!Array.isArray(hist)) hist = [];
let rates = lsGet(RKEY, {rates:{}, at:0});
const params = new URLSearchParams(location.search);
let view = 'home', scan = null, busy = false, S = null, pendingAppend = false;

/* TripBudget: ทริปที่เปิดอยู่ (อ่านอย่างเดียว) */
function trip(){ const a = lsGet(TB_ACTIVE, null); return a && a.tripId ? a : null; }
function ctx(){
  const t = trip(), pc = (params.get('country') || '').toUpperCase();

    catch (e) { st.cfg = prev; s.textContent = '❌ ' + e.message; } },
  async register(){ const name = $('#aName').value.trim(), s = $('#aStatus'); if (!name) { s.textContent = 'ใส่ชื่อก่อน'; $('#aName').focus(); return; }
    s.textContent = '⏳ กำลังส่งคำขอ...';
    try { const d = await callAI({action:'register', name}, 30000); st.name = d.name || name; st.access = d.access || 'pending'; save(); render();
      toast(canScan() ? 'อนุมัติแล้ว ใช้ได้เลย' : 'ส่งคำขอแล้ว รอเจ้าของอนุมัติ'); }
    catch (e) { const el = $('#aStatus'); if (el) el.textContent = '❌ ' + e.message; } },
  async checkAccess(){ await refreshAccess(true); },
  applyUpdate(){ applyUpdate(); }
};
async function refreshAccess(manual){
  if (!ready()) return; const s = $('#aStatus'); if (s) s.textContent = '⏳';
  try { const d = await callAI({action:'ping'}, 30000); const was = st.access; st.access = d.access || 'legacy'; if (d.name) st.name = d.name; save();
    if (manual || was !== st.access) { render(); if (canScan() && was !== st.access) toast('✅ ได้รับอนุมัติแล้ว ใช้ได้เลย'); else if (manual) toast(ACCESS_TH[st.access] || st.access); } }
  catch (e) { const el = $('#aStatus'); if (el) el.textContent = '❌ ' + e.message; }
}

/* ============ EVENTS ============ */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if ((el.id === 'fCam' || el.id === 'fGal') && el.files[0]) { const f = el.files[0]; el.value = ''; doScan(f); return; }
  if (el.id === 'hTok' || el.id === 'aName') return;
  if (el.id === 'cCountry') { st.country = el.value; st.curr = ''; save(); render(); return; }
  if (el.id === 'cCurr') { st.curr = el.value; save(); render(); return; }
});
// ยกเลิก "ถ่ายหน้าถัดไป" ถ้าผู้ใช้ปิดกล้องโดยไม่ถ่าย
window.addEventListener('focus', () => setTimeout(() => { if (!busy) pendingAppend = false; }, 1500));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'hTok') { A.quickTok(); return; } if (e.key === 'Enter' && e.target.id === 'aName') { A.register(); return; } if (e.key !== 'Escape') return; if (!$('#big').hidden) { $('#big').hidden = true; return; } if (!$('#lb').hidden) { $('#lb').hidden = true; return; } if (S) closeSheet(); });
window.addEventListener('storage', e => { if (e.key === TB_ACTIVE) render(); });
window.addEventListener('online', render); window.addEventListener('offline', render);
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; render(); if (st.access === 'pending') refreshAccess(false); });

/* ============ UPDATE (service worker) ============ */
let swReg = null, updating = false;
function applyUpdate(){ updating = true; if (swReg && swReg.waiting) swReg.waiting.postMessage('SKIP_WAITING'); else location.reload(); }
function setupSW(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => { swReg = reg;
    const show = () => { if (reg.waiting && navigator.serviceWorker.controller) $('#updBar').hidden = false; };
    show(); reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') show(); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60e3);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (updating) location.reload(); });
}

/* ============ BOOT ============ */
(async function boot(){
  const m = location.hash.match(/^#setup=([\w-]+)/);
  render();
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    try { const b = m[1].replace(/-/g, '+').replace(/_/g, '/'); const o = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
      if (o.u && o.t && await dialog({title:'ใช้การตั้งค่าจากลิงก์นี้?', text:'ลิงก์นี้ตั้งค่าการเชื่อม AI ให้อัตโนมัติ (ได้มาจากเพื่อนหรือเจ้าของแอป)', ok:'ใช้เลย'})) {
        st.cfg = {...st.cfg, url:String(o.u), token:String(o.t)}; st.access = ''; save(); render(); await refreshAccess(false); render(); toast(canScan() ? 'ตั้งค่าเรียบร้อย ถ่ายเมนูได้เลย' : 'ตั้งค่าแล้ว ใส่ชื่อเพื่อขอใช้งาน'); }
    } catch { toast('ลิงก์ตั้งค่าไม่ถูกต้อง', 'bad'); }
  }
  fetchRates().then(render); setupSW();
  if (ready() && !['approved', 'owner'].includes(st.access)) refreshAccess(false);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
